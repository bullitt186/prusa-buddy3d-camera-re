# NetworkManager randomizes the Wi-Fi MAC during scans by default
# ("set-hw-addr: set MAC address to ... (scanning)"). The appliance's identity
# fingerprint is derived from the wlan0 MAC, so a background scan changed the
# fingerprint and broke the Prusa Connect token binding: registration/info
# returned {"detail":"Invalid fingerprint"}, snapshots 400, and the Socket.IO
# signaling auth was rejected (ACK=1), so the live view never came up.
# Disable scan randomization so the MAC -- and therefore the fingerprint -- is
# stable for the life of the device.
[device]
wifi.scan-rand-mac-address=no
