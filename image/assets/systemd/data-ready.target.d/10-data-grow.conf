# Image-only drop-in attaching the first-boot grow unit to the reused
# data-ready.target (source §3.2: local-fs.target -> prusa-data-grow.service ->
# data-ready.target). The target file itself lives in pi-impersonator/systemd/
# and is reused verbatim, so the extra dependency is added here.
[Unit]
Requires=prusa-data-grow.service
After=prusa-data-grow.service
