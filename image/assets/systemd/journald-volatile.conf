# Volatile, size-limited journald for the Buddy3D appliance (AC-13).
#
# ROOT is a read-only overlayfs with a tmpfs upper layer, so the journal cannot
# be relied on across a power cycle. Keep it in RAM and bound its size instead of
# pretending it is persistent; the web UI exposes a redacted, bounded diagnostic
# log assembled from the current boot (source plan §2.5).
[Journal]
Storage=volatile
RuntimeMaxUse=32M
SystemMaxUse=32M
