# METABEGIN
# X-Env-Layer-Name: buddy3d-image
# X-Env-Layer-Category: image
# X-Env-Layer-Desc: Buddy3D appliance MBR layout: BOOT (vfat, 512M) + ROOT
#  (ext4, 4G, immutable overlay lower) + PERSIST (ext4, 512M, last partition,
#  mounted at /data and grown to the end of the device on first boot).
#  genimage(1) supports an arbitrary number of MBR primary partitions, so the
#  third partition is expressed directly in the layer's own template rather
#  than by extending the built-in two-partition image-rpios layer.
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: image-base
# X-Env-Layer-Provides: image
#
# X-Env-VarPrefix: image
#
# X-Env-Var-rootfs_type: ext4
# X-Env-Var-rootfs_type-Desc: Root filesystem type for this layout.
# X-Env-Var-rootfs_type-Required: n
# X-Env-Var-rootfs_type-Valid: keywords:ext4
# X-Env-Var-rootfs_type-Set: y
#
# X-Env-Var-boot_part_size: 512M
# X-Env-Var-boot_part_size-Desc: BOOT partition size (vfat).
# X-Env-Var-boot_part_size-Required: n
# X-Env-Var-boot_part_size-Valid: size
# X-Env-Var-boot_part_size-Set: y
#
# X-Env-Var-root_part_size: 4G
# X-Env-Var-root_part_size-Desc: ROOT partition size (ext4). The build fails
#  if the populated filesystem exceeds 75% of this (AC-13).
# X-Env-Var-root_part_size-Required: n
# X-Env-Var-root_part_size-Valid: size
# X-Env-Var-root_part_size-Set: y
#
# X-Env-Var-persist_part_size: 512M
# X-Env-Var-persist_part_size-Desc: PERSIST partition size in the image (ext4).
#  Grown to the end of the device on first boot (AC-11).
# X-Env-Var-persist_part_size-Required: n
# X-Env-Var-persist_part_size-Valid: size
# X-Env-Var-persist_part_size-Set: y
#
# X-Env-Var-assetdir: ${DIRECTORY}
# X-Env-Var-assetdir-Desc: Image asset directory holding the genimage template
#  and pre-image/setup/post-build hooks (resolved by bin/runner as IMAGE_ASSET).
# X-Env-Var-assetdir-Required: n
# X-Env-Var-assetdir-Valid: dir
# X-Env-Var-assetdir-Set: y
#
# X-Env-Var-assetsdir: ${DIRECTORY}/../assets
# X-Env-Var-assetsdir-Desc: Image-only assets installed into the rootfs by
#  install-factory-app.sh (grow script/unit, prusa-camera.target, build-info).
# X-Env-Var-assetsdir-Required: n
# X-Env-Var-assetsdir-Valid: dir
# X-Env-Var-assetsdir-Set: y
#
# X-Env-Var-reporoot: ${DIRECTORY}/../..
# X-Env-Var-reporoot-Desc: Repository root, used to install the factory
#  application from pi-impersonator/ and to reuse pi-impersonator/systemd/.
# X-Env-Var-reporoot-Required: n
# X-Env-Var-reporoot-Valid: dir
# X-Env-Var-reporoot-Set: y
#
# X-Env-Var-disksig: random
# X-Env-Var-disksig-Desc: MBR disk signature supplied as a 32-bit hexadecimal
#  number, or 'random'. Pinning it makes the derived PARTUUIDs deterministic
#  (<signature>-01/02/03) so cmdline.txt and fstab can be static.
# X-Env-Var-disksig-Required: n
# X-Env-Var-disksig-Valid: regex:^(random|0x[0-9a-fA-F]{8})$
# X-Env-Var-disksig-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - dosfstools
    - e2fsprogs
    - initramfs-tools
  customize-hooks:
    # Factory app + image layout. See image/assets/install-factory-app.sh.
    - >-
      "${IGconf_image_assetsdir}/install-factory-app.sh" "$1" "${IGconf_image_reporoot}"
    # genimage populates the PERSIST partition from the rootfs mountpoint /data
    # and leaves an empty /data mount point in ROOT. The directory must exist in
    # the rootfs for genimage's mountpoint move to succeed (otherwise it fails
    # with "cannot stat .../root/data"). persist_restore.py recreates the
    # durable layout at runtime, so an empty mount point is correct (AC-10).
    - install -d -m 0755 "$1/data"
